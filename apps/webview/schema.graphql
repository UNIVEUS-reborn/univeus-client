scalar DateTime

interface Node {
  id: ID!
}

"""
Relay connection 페이지 정보
"""
type PageInfo {
  startCursor: ID
  endCursor: ID
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

"""
예상하지 못한 서버 에러
"""
type UnexpectedError {
  message: String!
}

"""
업로드된 이미지. id는 imageIds에 넣는 값이고 createImageUploadUrl의 imageId와 같아요
"""
type Image implements Node {
  id: ID!
  url: String!
}

"""
성별
"""
enum Gender {
  MALE
  FEMALE
}

"""
단과대학
"""
enum College {
  """
  인문대학
  """
  HUMANITIES
  """
  예술체육대학
  """
  ARTS_AND_PHYSICAL_EDUCATION
  """
  사회과학대학
  """
  SOCIAL_SCIENCES
  """
  소프트웨어경영대학
  """
  SOFTWARE_AND_BUSINESS
  """
  융합과학대학
  """
  CONVERGENCE_SCIENCE
  """
  창의공과대학
  """
  CREATIVE_ENGINEERING
  """
  관광문화대학
  """
  TOURISM_AND_CULTURE
}

"""
유저
"""
type User implements Node {
  id: ID!
  _id: ID!
  nickname: String!
  profileImage: Image
  gender: Gender!
  """
  입학 연도 (예: 2019)
  """
  admissionYear: Int!
  college: College!
  """
  인증 회원 여부 (모임 카드·상세의 인증 뱃지, 지급 기준은 서버가 정함)
  """
  isVerified: Boolean!
  """
  조회한 사람 본인인지. 프로필을 누르면 본인은 마이 탭, 아니면 유저 프로필로 가요
  """
  isViewer: Boolean!
  """
  N문 N답. 작성하지 않았으면 null
  """
  introduction: UserIntroduction
  """
  만든 모임 수
  """
  createdGroupCount: Int!
  """
  참여한 모임 수 (승인된 참여만, 승인 대기 제외)
  """
  joinedGroupCount: Int!
}

"""
N문 N답. 답하지 않은 질문은 null
"""
type UserIntroduction {
  """
  나의 MBTI는
  """
  mbti: String
  """
  나의 최애 음식은
  """
  favoriteFood: String
  """
  내가 요새 듣는노래는
  """
  recentSong: String
  """
  나의 관심사는
  """
  interest: String
  """
  이런 사람이랑 잘 맞아요
  """
  matchingPerson: String
  """
  대학생활동안 제일 해보고 싶은건
  """
  collegeGoal: String
}

"""
로그인한 사람. 본인만 보는 정보를 둬요
"""
type Viewer implements Node {
  id: ID!
  user: User!
  """
  내가 만든 모임 (최신 순)
  """
  createdGroups(first: Int, after: ID): GroupConnection!
  """
  내가 참여한 모임 (승인 대기 포함, 최신 순)
  """
  joinedGroups(first: Int, after: ID): GroupConnection!
  """
  문자 및 마케팅 수신동의
  """
  marketingAgreed: Boolean!
}

"""
로그인 상태
"""
enum AuthStatus {
  """
  로그아웃
  """
  SIGNED_OUT
  """
  로그인했지만 회원가입을 끝내지 않음
  """
  SIGNING_UP
  """
  로그인, 회원가입 완료
  """
  SIGNED_IN
}

"""
회원가입 단계 (순서대로)
"""
enum SignupStep {
  """
  휴대폰 본인인증
  """
  IDENTITY_VERIFICATION
  """
  약관동의
  """
  TERMS_AGREEMENT
  """
  소속등록
  """
  AFFILIATION
  """
  프로필 등록
  """
  PROFILE
}

"""
현재 로그인 상태. 서버 세션·토큰과는 관계없어요 (인증은 쿠키로만 오가요).
id는 사용자·로그인 여부와 관계없이 항상 같은 고정값("AuthState")이라, 가입 mutation 결과가 root의 authState와 같은 레코드로 합쳐져요
"""
type AuthState implements Node {
  id: ID!
  status: AuthStatus!
  """
  끝내지 않은 첫 가입 단계. SIGNING_UP일 때만 있어요
  """
  signupStep: SignupStep
}

"""
닉네임 사용 가능 여부
"""
enum NicknameAvailability {
  """
  사용 가능
  """
  AVAILABLE
  """
  이미 쓰는 닉네임
  """
  DUPLICATED
  """
  형식 오류 (2~13자, 특수문자 불가)
  """
  INVALID_FORMAT
}

"""
모임 카테고리
"""
enum GroupCategory {
  """
  우주공강
  """
  FREE_PERIOD
  """
  스펙쌓기
  """
  CAREER
  """
  취미/문화
  """
  HOBBY_CULTURE
  """
  습관형성
  """
  HABIT
  """
  맛집탐방
  """
  FOOD
  """
  취업활동
  """
  JOB_HUNTING
  """
  수업친구
  """
  CLASS_FRIEND
  """
  기타모임
  """
  ETC
}

"""
참여 승인 방식
"""
enum ParticipationMethod {
  """
  신청 즉시 참여
  """
  AUTO_APPROVAL
  """
  호스트 승인 후 참여
  """
  MANUAL_APPROVAL
}

"""
참여 가능 성별
"""
enum GenderRestriction {
  ANY
  MALE_ONLY
  FEMALE_ONLY
}

"""
모집 상태
"""
enum GroupStatus {
  RECRUITING
  """
  호스트가 직접 마감
  """
  CLOSED_BY_HOST
  """
  정원 도달
  """
  CLOSED_FULL
  """
  모임 3시간 전 자동 마감
  """
  CLOSED_DEADLINE
}

"""
조회한 사람(viewer)과 모임의 관계
"""
enum GroupViewerRole {
  HOST
  PARTICIPANT
  """
  수동 승인 대기 중
  """
  PENDING
  NONE
}

"""
모임
"""
type Group implements Node {
  id: ID!
  _id: ID!
  title: String!
  content: String!
  category: GroupCategory!
  images: [Image!]!
  """
  모임 일시
  """
  meetingAt: DateTime!
  """
  모집 마감 일시 (모임 3시간 전)
  """
  recruitDeadlineAt: DateTime!
  location: String!
  """
  정원 (호스트 제외, 1~5)
  """
  capacity: Int!
  """
  현재 참여 인원 (호스트 제외, 승인 대기 제외)
  """
  participantCount: Int!
  participationMethod: ParticipationMethod!
  genderRestriction: GenderRestriction!
  status: GroupStatus!
  host: User!
  viewerRole: GroupViewerRole!
  """
  조회한 사람이 참여할 수 없는 이유. 성별 조건은 서버가 판단해요
  """
  viewerJoinRestriction: GroupJoinRestriction!
  """
  참여자 목록 (호스트 제외, 승인 대기 포함, 신청 순). 모집이 끝나면 서버가 승인 대기를 지워요
  """
  participations: [Participation!]!
  createdAt: DateTime!
}

"""
조회한 사람의 참여 제한
"""
enum GroupJoinRestriction {
  """
  제한 없음
  """
  NONE
  """
  성별 조건이 맞지 않음
  """
  GENDER
}

"""
참여 상태
"""
enum ParticipationStatus {
  """
  참여 중
  """
  PARTICIPATING
  """
  호스트 승인 대기 중
  """
  PENDING
}

"""
모임 참여 신청 한 건
"""
type Participation implements Node {
  id: ID!
  user: User!
  status: ParticipationStatus!
  group: Group!
}

type GroupConnection {
  edges: [GroupEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GroupEdge {
  node: Group!
  cursor: ID!
}

type Query {
  node(id: ID!): Node
  """
  홈 목록. category가 null이면 전체
  """
  groups(category: GroupCategory, first: Int, after: ID): GroupConnection!
  searchGroups(query: String!, first: Int, after: ID): GroupConnection!
  """
  groupId: Group._id (URL 경로의 ID)
  """
  group(groupId: ID!): Group
  """
  로그인한 사람
  """
  viewer: Viewer!
  """
  userId: User._id (URL 경로의 ID)
  """
  user(userId: ID!): User
  """
  닉네임 중복확인. 지금 내 닉네임이면 AVAILABLE
  """
  nicknameAvailability(nickname: String!): NicknameAvailability!
  """
  로그인 상태. 로그아웃이어도 답해요
  """
  authState: AuthState!
}

type Mutation {
  createGroup(input: CreateGroupInput!): CreateGroupResult!
  updateGroup(input: UpdateGroupInput!): UpdateGroupResult!
  closeGroup(input: CloseGroupInput!): CloseGroupResult!
  deleteGroup(input: DeleteGroupInput!): DeleteGroupResult!
  createImageUploadUrl(input: CreateImageUploadUrlInput!): CreateImageUploadUrlResult!
  """
  참여하기. 자동승인이면 바로 참여, 수동승인이면 승인 대기
  """
  joinGroup(input: JoinGroupInput!): JoinGroupResult!
  """
  참여 취소 (참여 중, 승인 대기 모두)
  """
  cancelParticipation(input: CancelParticipationInput!): CancelParticipationResult!
  """
  호스트가 승인 대기를 승인
  """
  approveParticipation(input: ApproveParticipationInput!): ApproveParticipationResult!
  """
  N문 N답 저장 (처음 작성과 수정 모두). 전체 값을 다시 보내요
  """
  saveIntroduction(input: SaveIntroductionInput!): SaveIntroductionResult!
  """
  프로필 변경 (닉네임, 프로필 사진)
  """
  updateProfile(input: UpdateProfileInput!): UpdateProfileResult!
  """
  문자 및 마케팅 수신동의 변경
  """
  updateMarketingAgreement(input: UpdateMarketingAgreementInput!): UpdateMarketingAgreementResult!
  """
  구글 로그인. 서버가 인증 쿠키를 설정해요
  """
  signInWithGoogle(input: SignInWithGoogleInput!): SignInWithGoogleResult!
  """
  로그아웃. 입력이 없어서 input을 받지 않아요
  """
  signOut: SignOutResult!
  """
  본인인증 번호 발송
  """
  requestPhoneVerification(input: RequestPhoneVerificationInput!): RequestPhoneVerificationResult!
  """
  본인인증 번호 확인. 성공하면 다음 가입 단계로 가요
  """
  verifyPhone(input: VerifyPhoneInput!): VerifyPhoneResult!
  """
  약관동의
  """
  agreeToTerms(input: AgreeToTermsInput!): AgreeToTermsResult!
  """
  소속등록
  """
  registerAffiliation(input: RegisterAffiliationInput!): RegisterAffiliationResult!
  """
  프로필 등록. 성공하면 가입 완료
  """
  registerProfile(input: RegisterProfileInput!): RegisterProfileResult!
}

"""
모임 생성
"""
input CreateGroupInput {
  title: String!
  content: String!
  category: GroupCategory!
  meetingAt: DateTime!
  location: String!
  capacity: Int!
  participationMethod: ParticipationMethod!
  genderRestriction: GenderRestriction!
  imageIds: [ID!]!
}

"""
수정 화면이 전체 값을 다시 보내는 방식 (부분 수정 아님)
"""
input UpdateGroupInput {
  """
  Group.id (global ID)
  """
  groupId: ID!
  title: String!
  content: String!
  category: GroupCategory!
  meetingAt: DateTime!
  location: String!
  capacity: Int!
  participationMethod: ParticipationMethod!
  genderRestriction: GenderRestriction!
  imageIds: [ID!]!
}

"""
모집 마감
"""
input CloseGroupInput {
  """
  Group.id (global ID)
  """
  groupId: ID!
}

"""
모임 삭제
"""
input DeleteGroupInput {
  """
  Group.id (global ID)
  """
  groupId: ID!
}

"""
이미지 업로드 용도
"""
enum ImageUploadPurpose {
  GROUP
  PROFILE
}

"""
허용 이미지 형식
"""
enum ImageContentType {
  JPEG
  PNG
  WEBP
  HEIC
}

"""
이미지 업로드 URL 발급
"""
input CreateImageUploadUrlInput {
  purpose: ImageUploadPurpose!
  contentType: ImageContentType!
  """
  파일 크기 (byte)
  """
  byteSize: Int!
}

type CreateGroupResult {
  """
  홈 목록 connection에 바로 추가할 수 있게 edge로 반환
  """
  edge: GroupEdge
  error: ErrorCreateGroup
}

type UpdateGroupResult {
  group: Group
  error: ErrorUpdateGroup
}

type CloseGroupResult {
  group: Group
  error: ErrorCloseGroup
}

type DeleteGroupResult {
  success: Boolean
  deletedId: ID
  error: ErrorDeleteGroup
}

type CreateImageUploadUrlResult {
  """
  이 URL로 PUT 업로드
  """
  uploadUrl: String
  imageId: ID
  error: ErrorCreateImageUploadUrl
}

"""
모임을 찾을 수 없음
"""
type NotFoundGroupError {
  message: String!
}

"""
호스트만 할 수 있는 작업
"""
type NotGroupHostError {
  message: String!
}

"""
이미 마감된 모임
"""
type GroupAlreadyClosedError {
  message: String!
}

"""
모임 입력 항목
"""
enum GroupInputField {
  TITLE
  CONTENT
  CATEGORY
  MEETING_AT
  LOCATION
  CAPACITY
  IMAGES
}

"""
입력값 검증 실패. field로 어느 입력이 틀렸는지 표시
"""
type InvalidGroupInputError {
  message: String!
  field: GroupInputField
}

"""
수정한 정원이 현재 참여 인원보다 적음
"""
type CapacityBelowParticipantsError {
  message: String!
  participantCount: Int!
}

"""
허용하지 않는 이미지 형식
"""
type UnsupportedImageTypeError {
  message: String!
}

"""
허용 용량 초과
"""
type ImageTooLargeError {
  message: String!
  maxByteSize: Int!
}

union ErrorCreateGroup = InvalidGroupInputError | UnexpectedError

union ErrorUpdateGroup = NotFoundGroupError | NotGroupHostError | GroupAlreadyClosedError | InvalidGroupInputError | CapacityBelowParticipantsError | UnexpectedError

union ErrorCloseGroup = NotFoundGroupError | NotGroupHostError | GroupAlreadyClosedError | UnexpectedError

union ErrorDeleteGroup = NotFoundGroupError | NotGroupHostError | UnexpectedError

union ErrorCreateImageUploadUrl = UnsupportedImageTypeError | ImageTooLargeError | UnexpectedError

input JoinGroupInput {
  """
  Group.id (global ID)
  """
  groupId: ID!
}

input CancelParticipationInput {
  """
  Group.id (global ID). 조회한 사람의 참여를 취소해요
  """
  groupId: ID!
}

input ApproveParticipationInput {
  """
  Participation.id (global ID)
  """
  participationId: ID!
}

type JoinGroupResult {
  """
  viewerRole이 PARTICIPANT면 참여 완료, PENDING이면 승인 대기
  """
  group: Group
  error: ErrorJoinGroup
}

type CancelParticipationResult {
  group: Group
  error: ErrorCancelParticipation
}

type ApproveParticipationResult {
  """
  group으로 participantCount, status 변화를 같이 받아요
  """
  participation: Participation
  error: ErrorApproveParticipation
}

"""
이미 참여 중이거나 승인 대기 중, 또는 호스트
"""
type AlreadyJoinedGroupError {
  message: String!
}

"""
성별 조건이 맞지 않아 참여할 수 없음
"""
type GenderRestrictedGroupError {
  message: String!
}

"""
조회한 사람이 이 모임에 참여하지 않음
"""
type NotGroupParticipantError {
  message: String!
}

"""
참여 신청을 찾을 수 없음
"""
type NotFoundParticipationError {
  message: String!
}

"""
이미 승인된 참여
"""
type ParticipationAlreadyApprovedError {
  message: String!
}

union ErrorJoinGroup = NotFoundGroupError | GroupAlreadyClosedError | AlreadyJoinedGroupError | GenderRestrictedGroupError | UnexpectedError

union ErrorCancelParticipation = NotFoundGroupError | GroupAlreadyClosedError | NotGroupParticipantError | UnexpectedError

union ErrorApproveParticipation = NotFoundParticipationError | NotGroupHostError | GroupAlreadyClosedError | ParticipationAlreadyApprovedError | UnexpectedError

"""
N문 N답 입력. 빈 답은 null, 각 답은 최대 30자
"""
input SaveIntroductionInput {
  mbti: String
  favoriteFood: String
  recentSong: String
  interest: String
  matchingPerson: String
  collegeGoal: String
}

input UpdateProfileInput {
  """
  2~13자, 특수문자 불가
  """
  nickname: String!
  """
  Image.id (createImageUploadUrl의 imageId, purpose PROFILE). null이면 사진을 지워요
  """
  profileImageId: ID
}

input UpdateMarketingAgreementInput {
  agreed: Boolean!
}

type SaveIntroductionResult {
  user: User
  error: ErrorSaveIntroduction
}

type UpdateProfileResult {
  user: User
  error: ErrorUpdateProfile
}

type UpdateMarketingAgreementResult {
  viewer: Viewer
  error: ErrorUpdateMarketingAgreement
}

"""
N문 N답 입력 항목
"""
enum IntroductionField {
  MBTI
  FAVORITE_FOOD
  RECENT_SONG
  INTEREST
  MATCHING_PERSON
  COLLEGE_GOAL
}

"""
N문 N답 답이 30자를 넘음
"""
type InvalidIntroductionInputError {
  message: String!
  field: IntroductionField!
}

"""
이미 쓰는 닉네임
"""
type DuplicatedNicknameError {
  message: String!
}

"""
닉네임 형식 오류 (2~13자, 특수문자 불가)
"""
type InvalidNicknameError {
  message: String!
}

union ErrorSaveIntroduction = InvalidIntroductionInputError | UnexpectedError

union ErrorUpdateProfile = DuplicatedNicknameError | InvalidNicknameError | UnexpectedError

union ErrorUpdateMarketingAgreement = UnexpectedError

input SignInWithGoogleInput {
  """
  구글 OpenID Connect ID 토큰
  """
  googleIdToken: String!
}

input RequestPhoneVerificationInput {
  """
  숫자 11자리 (하이픈 없음)
  """
  phoneNumber: String!
}

input VerifyPhoneInput {
  """
  숫자 11자리 (하이픈 없음)
  """
  phoneNumber: String!
  """
  숫자 6자리
  """
  code: String!
}

input AgreeToTermsInput {
  """
  이용약관 동의 (필수)
  """
  serviceTerms: Boolean!
  """
  개인정보 제공 및 활용 동의 (필수)
  """
  privacyPolicy: Boolean!
  """
  문자 수신 동의 (선택). Viewer.marketingAgreed와 같은 값이에요
  """
  marketing: Boolean!
}

input RegisterAffiliationInput {
  college: College!
  """
  전체 학번, 숫자 9자리. 서버가 입학 연도를 정해요
  """
  studentId: String!
}

input RegisterProfileInput {
  """
  2~13자, 특수문자 불가
  """
  nickname: String!
  gender: Gender!
  """
  Image.id (createImageUploadUrl의 imageId, purpose PROFILE). 사진 없이 가입하면 null
  """
  profileImageId: ID
}

type SignInWithGoogleResult {
  authState: AuthState
  error: ErrorSignInWithGoogle
}

type SignOutResult {
  authState: AuthState
  error: ErrorSignOut
}

type RequestPhoneVerificationResult {
  """
  발송 성공
  """
  success: Boolean
  error: ErrorRequestPhoneVerification
}

type VerifyPhoneResult {
  authState: AuthState
  error: ErrorVerifyPhone
}

type AgreeToTermsResult {
  authState: AuthState
  error: ErrorAgreeToTerms
}

type RegisterAffiliationResult {
  authState: AuthState
  error: ErrorRegisterAffiliation
}

type RegisterProfileResult {
  authState: AuthState
  error: ErrorRegisterProfile
}

"""
경기대학교 메일 계정이 아님
"""
type NotUniversityEmailError {
  message: String!
}

"""
구글 ID 토큰이 유효하지 않음
"""
type InvalidGoogleTokenError {
  message: String!
}

"""
휴대폰 번호 형식 오류
"""
type InvalidPhoneNumberError {
  message: String!
}

"""
인증번호가 일치하지 않음
"""
type InvalidVerificationCodeError {
  message: String!
}

"""
필수 약관에 동의하지 않음
"""
type RequiredTermsNotAgreedError {
  message: String!
}

"""
학번 형식 오류 (숫자 9자리)
"""
type InvalidStudentIdError {
  message: String!
}

union ErrorSignInWithGoogle = NotUniversityEmailError | InvalidGoogleTokenError | UnexpectedError

union ErrorSignOut = UnexpectedError

union ErrorRequestPhoneVerification = InvalidPhoneNumberError | UnexpectedError

union ErrorVerifyPhone = InvalidVerificationCodeError | UnexpectedError

union ErrorAgreeToTerms = RequiredTermsNotAgreedError | UnexpectedError

union ErrorRegisterAffiliation = InvalidStudentIdError | UnexpectedError

union ErrorRegisterProfile = DuplicatedNicknameError | InvalidNicknameError | UnexpectedError
